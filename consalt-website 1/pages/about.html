<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Owl Carousel CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
  </head>
  <body>

    <div class="container-fluid py-5">
        <div class="owl-carousel owl-theme">
            <div class="item bg-light p-4 text-center"><h4>1</h4></div>
            <div class="item bg-light p-4 text-center"><h4>2</h4></div>
            <div class="item bg-light p-4 text-center"><h4>3</h4></div>
            <div class="item bg-light p-4 text-center"><h4>4</h4></div>
            <div class="item bg-light p-4 text-center"><h4>5</h4></div>
            <div class="item bg-light p-4 text-center"><h4>6</h4></div>
            <div class="item bg-light p-4 text-center"><h4>7</h4></div>
            <div class="item bg-light p-4 text-center"><h4>8</h4></div>
            <div class="item bg-light p-4 text-center"><h4>9</h4></div>
            <div class="item bg-light p-4 text-center"><h4>10</h4></div>
            <div class="item bg-light p-4 text-center"><h4>11</h4></div>
            <div class="item bg-light p-4 text-center"><h4>12</h4></div>
        </div>
    </div>

    <!-- 1. Load jQuery 3.7.1 first -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <!-- 2. Load Owl Carousel JS second -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    
    <!-- 3. Load Bootstrap Bundle third -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 4. Run your initialization script LAST -->
    <script>
      $(document).ready(function(){
          $('.owl-carousel').owlCarousel({
              loop: true,
              margin: 10,
              nav: true,
              responsive: {
                  0: { items: 1 },
                  600: { items: 3 },
                  1000: { items: 5 }
              }
          });
      });
    </script>
  </body>
</html>
